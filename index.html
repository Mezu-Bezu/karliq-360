<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171613">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="Karliq 360°">
  <meta property="og:description" content="Se dig omkring i vardagsrummet.">
  <meta property="og:image" content="https://mezu-bezu.github.io/karliq-360/vardagsrum.png">
  <title>Karliq 360°</title>
  <link rel="manifest" href="./app.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./viewer.css">
  <script type="module" src="./viewer.js"></script>
</head>
<body>
  <main id="viewer" aria-label="Vardagsrummet i 360 grader">
    <img id="panorama" src="./vardagsrum.png" alt="Vardagsrummets panorama" fetchpriority="high">
    <canvas id="view" tabindex="0" aria-label="360°-vy. Dra eller använd piltangenterna. Nyp eller skrolla för att zooma." hidden></canvas>
    <button id="fullscreen" type="button" aria-label="Helskärm" title="Helskärm" hidden>
      <svg id="expand" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
      <svg id="contract" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M4 9h5V4m11 5h-5V4M4 15h5v5m11-5h-5v5"/></svg>
    </button>
    <dialog id="fullscreen-help" aria-label="Helskärm på mobilen">
      <form method="dialog">
        <p id="fullscreen-message"></p>
        <button type="submit" aria-label="Stäng">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </form>
    </dialog>
  </main>
</body>
</html>
