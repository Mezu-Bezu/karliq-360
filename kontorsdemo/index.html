  <style>
:root {
  color-scheme: dark;
  background: #171613;
  font-family: system-ui, sans-serif;
}

body { margin: 0; overflow: hidden; overscroll-behavior: none; }
[hidden] { display: none !important; }

#viewer {
  position: relative;
  height: 100vh;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
  background: #171613;
}

#viewer:fullscreen { height: 100%; width: 100%; }
#viewer:-webkit-full-screen { height: 100%; width: 100%; }

#view, #panorama { display: block; width: 100%; height: 100%; }
#panorama { object-fit: contain; }
#view { touch-action: none; cursor: grab; }
#view:active { cursor: grabbing; }

button {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  padding: 0;
  border: 1px solid rgb(255 255 255 / 36%);
  border-radius: 12px;
  background: rgb(20 20 19 / 76%);
  color: white;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#fullscreen {
  position: absolute;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 2px 12px rgb(0 0 0 / 26%);
}

button svg {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
}

button:hover { background: #262623; }
button:focus-visible, canvas:focus-visible { outline: 2px solid white; outline-offset: -3px; }

dialog {
  max-width: min(25rem, calc(100vw - 64px));
  padding: 16px;
  border: 1px solid #65635c;
  border-radius: 12px;
  color: white;
  background: #24231f;
}

dialog::backdrop { background: rgb(0 0 0 / 55%); }
dialog form { display: flex; gap: 12px; align-items: center; }
dialog p { margin: 0; line-height: 1.5; }
dialog button { flex-shrink: 0; }

#demo-note, #share-status {
  position: absolute;
  z-index: 1;
  box-sizing: border-box;
  color: #fff;
  background: rgb(20 20 19 / 92%);
  border: 1px solid rgb(255 255 255 / 26%);
  border-radius: 12px;
  padding: .65rem .85rem;
  line-height: 1.45;
}
#demo-note {
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: calc(12px + env(safe-area-inset-left, 0px));
  max-width: min(27rem, calc(100% - 28px));
  font-size: .875rem;
  pointer-events: none;
}
#demo-note strong { display: block; }
#share-status {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(25rem, calc(100% - 2rem));
  margin: 0;
  text-align: center;
}
</style>
</head>

        </button>
      </form>
    </dialog>
  </main>
  <script>
const viewer = document.getElementById('viewer');
const canvas = document.getElementById('view');
const panorama = document.getElementById('panorama');
const fullscreen = document.getElementById('fullscreen');
const help = document.getElementById('fullscreen-help');
const radians = Math.PI / 180;
const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
const pointers = new Map();
let yaw = 2 * radians;
let pitch = -3 * radians;
let fov = innerWidth < innerHeight ? 82 : 65;
let drawFrame;
let pending = false;

// The same equirectangular mapping as the Karliq tour viewer, applied to a
// camera ray for each screen pixel.
const vertexSource = `#version 300 es
out vec2 screenPoint;
void main() {
  vec2 corners[3] = vec2[3](vec2(-1., -1.), vec2(3., -1.), vec2(-1., 3.));
  screenPoint = corners[gl_VertexID];
  gl_Position = vec4(screenPoint, 0., 1.);
}`;

const fragmentSource = `#version 300 es
precision highp float;
in vec2 screenPoint;
out vec4 color;
uniform sampler2D panorama;
uniform vec3 forward, right, up;
uniform vec2 field;
void main() {
  vec3 ray = normalize(forward + right * screenPoint.x * field.x + up * screenPoint.y * field.y);
  vec2 uv = vec2(atan(ray.x, -ray.z) / 6.28318530718 + .5,
                 asin(clamp(ray.y, -1., 1.)) / 3.14159265359 + .5);
  vec2 dx = dFdx(uv), dy = dFdy(uv);
  dx.x -= round(dx.x);
  dy.x -= round(dy.x);
  color = textureGrad(panorama, uv, dx, dy);
}`;

function textureSource(gl) {
  const maxWidth = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  if (panorama.naturalWidth <= maxWidth) return panorama;

  const scaled = document.createElement('canvas');
  scaled.width = maxWidth - maxWidth % 2;
  scaled.height = scaled.width / 2;
  const context = scaled.getContext('2d');
  if (!context) throw new Error('Kunde inte anpassa panoramat till skärmen.');
  context.imageSmoothingQuality = 'high';
  context.drawImage(panorama, 0, 0, scaled.width, scaled.height);
  return scaled;
}

function createRenderer() {
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false });
  if (!gl) return null;
  const shader = (kind, source) => {
    const stage = gl.createShader(kind);
    gl.shaderSource(stage, source);
    gl.compileShader(stage);
    if (!gl.getShaderParameter(stage, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(stage));
    return stage;
  };
  const vertex = shader(gl.VERTEX_SHADER, vertexSource);
  const fragment = shader(gl.FRAGMENT_SHADER, fragmentSource);
  const program = gl.createProgram();
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.linkProgram(program);
  gl.deleteShader(vertex);
  gl.deleteShader(fragment);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, textureSource(gl));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.generateMipmap(gl.TEXTURE_2D);
  const forward = gl.getUniformLocation(program, 'forward');
  const right = gl.getUniformLocation(program, 'right');
  const up = gl.getUniformLocation(program, 'up');
  const field = gl.getUniformLocation(program, 'field');

  return () => {
    const ratio = Math.min(devicePixelRatio, 2);
    const width = Math.max(1, Math.round(canvas.clientWidth * ratio));
    const height = Math.max(1, Math.round(canvas.clientHeight * ratio));
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;
    gl.viewport(0, 0, width, height);
    const sin = Math.sin(pitch);
    const cos = Math.cos(pitch);
    const half = Math.tan(fov * radians / 2);
    gl.uniform3f(forward, Math.sin(yaw) * cos, sin, -Math.cos(yaw) * cos);
    gl.uniform3f(right, Math.cos(yaw), 0, Math.sin(yaw));
    gl.uniform3f(up, -Math.sin(yaw) * sin, cos, Math.cos(yaw) * sin);
    gl.uniform2f(field, half * width / height, half);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
}

function paint() {
  if (pending || !drawFrame) return;
  pending = true;
  requestAnimationFrame(() => {
    pending = false;
    drawFrame?.();
  });
}

function start() {
  try {
    drawFrame = createRenderer();
    if (!drawFrame) return;
    canvas.hidden = false;
    panorama.hidden = true;
    paint();
  } catch (error) {
    console.error(error);
  }
}

function turn(horizontal, vertical) {
  yaw += horizontal;
  pitch = clamp(pitch + vertical, -89 * radians, 89 * radians);
  paint();
}

function zoom(factor) {
  fov = clamp(2 * Math.atan(Math.tan(fov * radians / 2) * factor) / radians, 30, 96);
  paint();
}

canvas.addEventListener('pointerdown', event => {
  if (event.pointerType === 'mouse' && event.button !== 0) return;
  pointers.set(event.pointerId, [event.clientX, event.clientY]);
  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener('pointermove', event => {
  const old = pointers.get(event.pointerId);
  if (!old) return;
  const point = [event.clientX, event.clientY];
  pointers.set(event.pointerId, point);
  if (pointers.size > 1) {
    const pair = [...pointers.entries()].slice(0, 2);
    if (!pair.some(([id]) => id === event.pointerId)) return;
    const other = pair.find(([id]) => id !== event.pointerId)[1];
    const distance = Math.hypot(point[0] - other[0], point[1] - other[1]);
    const previous = Math.hypot(old[0] - other[0], old[1] - other[1]);
    if (distance > 8 && previous > 8) zoom(previous / distance);
    return;
  }
  const sensitivity = fov * radians / Math.max(canvas.clientHeight, 1);
  turn((old[0] - point[0]) * sensitivity, (point[1] - old[1]) * sensitivity);
});

for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  canvas.addEventListener(name, event => pointers.delete(event.pointerId));
}

canvas.addEventListener('wheel', event => {
  event.preventDefault();
  if (event.deltaY) zoom(event.deltaY > 0 ? 1.08 : 1 / 1.08);
}, { passive: false });

canvas.addEventListener('keydown', event => {
  const moves = { ArrowLeft: [-.12, 0], ArrowRight: [.12, 0], ArrowUp: [0, .12], ArrowDown: [0, -.12] };
  if (moves[event.key]) turn(...moves[event.key]);
  else if (event.key === '+') zoom(1 / 1.12);
  else if (event.key === '-') zoom(1.12);
  else return;
  event.preventDefault();
});

canvas.addEventListener('webglcontextlost', event => {
  event.preventDefault();
  drawFrame = null;
  canvas.hidden = true;
  panorama.hidden = false;
  pointers.clear();
});
canvas.addEventListener('webglcontextrestored', start);
new ResizeObserver(paint).observe(viewer);

const activeFullscreen = () => document.fullscreenElement || document.webkitFullscreenElement;
const installed = navigator.standalone || matchMedia('(display-mode: standalone)').matches;


function updateFullscreen() {
  const active = Boolean(activeFullscreen());
  const label = active ? 'Avsluta helskärm' : 'Helskärm';
  fullscreen.setAttribute('aria-label', label);
  fullscreen.title = label;
  document.getElementById('expand').toggleAttribute('hidden', active);
  document.getElementById('contract').toggleAttribute('hidden', !active);
  paint();
}

function showFullscreenHelp() {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  document.getElementById('fullscreen-message').textContent = ios
    ? 'På iPhone kan du vrida mobilen för att få en bredare vy.'
    : 'Öppna länken direkt i din webbläsare för att använda helskärm.';
  if (!help.open) help.showModal();
}

fullscreen.addEventListener('click', async () => {
  try {
    if (activeFullscreen()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      await exit.call(document);
    } else if (viewer.requestFullscreen) {
      await viewer.requestFullscreen({ navigationUI: 'hide' });
    } else if (viewer.webkitRequestFullscreen) {
      viewer.webkitRequestFullscreen();
    } else {
      showFullscreenHelp();
    }
  } catch {
    showFullscreenHelp();
  }
});

document.addEventListener('fullscreenchange', updateFullscreen);
document.addEventListener('webkitfullscreenchange', updateFullscreen);

const status = document.getElementById('share-status');

async function openSharedPanorama() {
  const fragment = location.hash.slice(1);
  if (!/^[A-Za-z0-9_-]{43}$/.test(fragment)) {
    status.textContent = 'Öppna hela länken från mejlet för att se kontorsvisningen.';
    return;
  }

  try {
    // Only the full link contains the key. The server stores an encrypted image.
    const rawKey = Uint8Array.from(atob(fragment.replace(/-/g, '+').replace(/_/g, '/')), character => character.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
    const response = await fetch('./panorama.bin');
    if (!response.ok) throw new Error('Panorama request failed.');
    const payload = new Uint8Array(await response.arrayBuffer());
    const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: payload.subarray(0, 12) }, key, payload.subarray(12));
    const imageUrl = URL.createObjectURL(new Blob([plaintext], { type: 'image/jpeg' }));
    panorama.src = imageUrl;
    try {
      await panorama.decode();
    } finally {
      URL.revokeObjectURL(imageUrl);
    }
    start();
    document.getElementById('demo-note').hidden = false;
    fullscreen.hidden = Boolean(installed);
    status.hidden = true;
  } catch {
    status.textContent = 'Visningen gick inte att öppna. Prova att öppna hela länken från mejlet i din webbläsare.';
  }
}

openSharedPanorama();

</script>
</body>
</html>
